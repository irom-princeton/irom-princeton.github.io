<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Publications · IRoM Lab · Princeton</title>
  <link rel="icon" href="assets/img/logos/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="css/site.css?v=13" />
  <script defer src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script defer src="js/site.js?v=13"></script>
</head>
<body data-page="publications">
  <header id="site-header" class="site-header"></header>
  <main>
    <div class="container">
      <div class="hero" style="padding-top:32px; padding-bottom: 8px;">
        <h1>Publications</h1>
        <p class="hero__tag">Selected works from the lab. See also our <a href="https://scholar.google.com/citations?user=ibu3FwsAAAAJ" target="_blank" rel="noopener">Google Scholar</a> page.</p>
        <div class="filter-bar" id="pub-filters">
          <button class="chip is-on" data-filter="all">All</button>
          <button class="chip" data-filter="conference">Conference</button>
          <button class="chip" data-filter="journal">Journal</button>
          <button class="chip" data-filter="reports">Tech reports</button>
          <button class="chip" data-filter="theses">Theses</button>
          <input id="pub-search" type="search" placeholder="Search by title, author, or venue…" />
        </div>
      </div>
      <div id="publications-list"><div class="loading">Loading publications…</div></div>
    </div>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
