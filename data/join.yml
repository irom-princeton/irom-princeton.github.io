intro: |
  We are always looking for talented and motivated people to join the lab.
  Below is the right path depending on your stage. We read every email,
  but please follow the relevant guidance so we can route yours quickly.

sections:
  - title: "Prospective PhD students"
    body: |
      The lab admits PhD students primarily through the
      [Princeton MAE](https://mae.princeton.edu/grad-program) PhD program.
      While students can also apply through other relevant departments
      (e.g., Computer Science and ECE), I am not directly involved with
      the admissions in these departments and may not see your
      application as a result.

      **What undergraduate majors are represented in the lab?** PhD
      students in our group come from a wide variety of undergraduate
      majors: computer science, electrical engineering, mechanical,
      aerospace, math, and physics.

      **How many courses are required for the MAE PhD program?** Our
      program is fairly light in terms of courses. Before the general
      exam, students need to take 6 courses (with two additional courses
      after the general exam, which can be taken pass/fail).

      **Do MAE PhD students need to take core MAE courses (e.g., fluids,
      mechanics)?** No, MAE PhD students do not need to take any courses
      in the MAE department during the PhD. Students in our group only
      take courses that are relevant to their research -- robotics,
      machine learning, optimization, etc.

  - title: "Postdocs"
    body: |
      We periodically host postdoctoral researchers. If your research
      interests align strongly with the lab's, please email Prof. Majumdar
      with your CV, a short research statement, and 2–3 representative
      papers.

  - title: "Princeton undergraduates"
    body: |
      Princeton undergraduates interested in research with the lab —
      including senior theses, junior independent work, and summer
      research — are encouraged to email Prof. Majumdar directly with
      a brief description of your background and interests.

  - title: "Visiting students & interns"
    body: |
      We occasionally host visiting students from other institutions.
      Spots are limited; please email the PI well in advance with your
      proposed dates, advisor, and a short research statement.

