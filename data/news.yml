    Our group's research is featured in the [A.I. Nation Podcast](https://whyy.org/episodes/ep-2-a-i-in-the-drivers-seat/) from [WHYY](https://whyy.org/) (NPR/PBS affiliate) and Princeton. The new podcast series was [highlighted on Princeton's homepage](https://www.princeton.edu/news/2021/04/01/hello-world-princeton-and-whyy-launch-new-podcast-ai-nation).

- date: "2021-03"
  body: |
    We have three papers accepted to **L4DC**:
    - U. Ghai\*, D. Snyder\*, A. Majumdar, and E. Hazan, *[Generating Adversarial Disturbances for Controller Verification](https://arxiv.org/abs/2012.06695)* **(Selected for oral presentation)**
    - M. Booker and A. Majumdar, *[Learning to Actively Reduce Memory Requirements for Robot Control Tasks](https://arxiv.org/abs/2008.07451)*
    - A. Sonar, V. Pacelli, and A. Majumdar, *[Invariant Policy Optimization: Towards Stronger Generalization in Reinforcement Learning](https://arxiv.org/abs/2006.01096)*

- date: "2021-02"
  body: |
    🏆 [NSF CAREER award](https://www.nsf.gov/awardsearch/showAward?AWD_ID=2044149&HistoricalAwards=false).

- date: "2021-02"
  body: |
    New preprints from our group. Feedback is welcome!
    - U. Ghai\*, D. Snyder\*, A. Majumdar, and E. Hazan, *[Generating Adversarial Disturbances for Controller Verification](https://arxiv.org/abs/2012.06695)*
    - A. Farid and A. Majumdar, *[PAC-BUS: Meta-learning Bounds via PAC-Bayes and Uniform Stability](https://arxiv.org/abs/2102.06589)*

- date: "2021-02"
  body: |
    🏆 We are delighted to have received an [Innovation Fund grant from Princeton SEAS](https://engineering-resources.princeton.edu/funding/) for a collaborative project with [Marcus Hultmark's group](http://fluids.princeton.edu/index.shtml).

- date: "2021-01"
  body: |
    🏆 [Young Faculty Researcher Award](https://cefr.princeton.edu/news/princeton-selected-toyota-research-institutes-academic-collaboration-program) from the Toyota Research Institute.

- date: "2020-11"
  body: |
    Our work on safety and generalization guarantees for learning-based control of robots was highlighted by Princeton Engineering in a news article: [Machine Learning Guarantees Robots' Performance in Unknown Territory](https://engineering.princeton.edu/news/2020/11/17/machine-learning-guarantees-robots-performance-unknown-territory).

- date: "2020-10"
  body: |
    Two papers accepted to the **2020 Conference on Robot Learning (CoRL)**:
    - *[Generalization Guarantees for Multi-Modal Imitation Learning](https://arxiv.org/abs/2008.01913)* — work led by Allen Ren and Sushant Veer
    - *[Probably Approximately Correct Vision-Based Planning using Motion Primitives](https://arxiv.org/abs/2002.12852)* — work led by Sushant Veer

- date: "2020-08"
  body: |
    Our paper *[PAC-Bayes Control: Learning Policies that Provably Generalize to Novel Environments](https://arxiv.org/abs/1806.04225)* was accepted to the **International Journal of Robotics Research (IJRR)**!

- date: "2020-08"
  body: |
    New preprints from our group. Feedback is welcome!
    - *[Generalization Guarantees for Multi-Modal Imitation Learning](https://arxiv.org/abs/2008.01913)* — work led by Allen Ren and Sushant Veer
    - *[Invariant Policy Optimization: Towards Stronger Generalization in Reinforcement Learning](https://arxiv.org/abs/2006.01096)* — work led by Anoop Sonar and Vince Pacelli
    - *[Learning to Actively Reduce Memory Requirements for Robot Control Tasks](https://arxiv.org/abs/2008.07451)* — work led by Meghan Booker

- date: "2020-07"
  body: |
    Sushant Veer has a new preprint *[CoNES: Convex Natural Evolutionary Strategies](https://arxiv.org/abs/2007.08601)* on high-dimensional blackbox optimization. Feedback is welcome.

- date: "2020-07"
  body: |
    🏆 **Vince Pacelli** was awarded the Crocco Award for Teaching Excellence. This prize was awarded by the MAE Department in recognition of outstanding performance as an Assistant in Instruction for *MAE 345: Introduction to Robotics*, in Fall 2019. Congrats Vince!

- date: "2020-05"
  body: |
    Our paper *Learning Task-Driven Control Policies via Information Bottlenecks* was accepted to **RSS 2020**! Vince's 5-min talk on the paper is available on [YouTube](https://youtu.be/nzLyRHON24E).

- date: "2020-05"
  body: |
    🏆 [Alfred Rheinstein Faculty Award](https://mae.princeton.edu/about-mae/news/congratulations-prof-anirudha-majumdar-receiving-alfred-rheinstein-faculty-award).

